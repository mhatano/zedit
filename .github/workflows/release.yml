name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.14.1
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Run unit tests
        run: zig build test

      - name: Cross-compile release binaries
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          for target in x86_64-windows x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos; do
            zig build -Doptimize=ReleaseSmall -Dtarget="$target" --prefix "dist/$target"
          done
          cp dist/x86_64-windows/bin/zedit.exe "release/zedit-${TAG}-x86_64-windows.exe"
          cp dist/x86_64-linux-musl/bin/zedit "release/zedit-${TAG}-x86_64-linux-musl"
          cp dist/aarch64-linux-musl/bin/zedit "release/zedit-${TAG}-aarch64-linux-musl"
          cp dist/x86_64-macos/bin/zedit "release/zedit-${TAG}-x86_64-macos"
          cp dist/aarch64-macos/bin/zedit "release/zedit-${TAG}-aarch64-macos"
          (cd release && sha256sum zedit-* > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "zedit ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/zedit-*
            release/SHA256SUMS.txt
